name: Build Android APK

# Runs whenever you push to main, or manually from the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API URL (e.g. https://api.yourdomain.com/api). Overrides the GitHub secret.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build React app
        working-directory: ./client
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || secrets.VITE_API_URL || 'https://your-backend-url.example.com/api' }}
          # Baked into the bundle so the in-app updater can compare itself
          # against whatever the server says is newest.
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_APP_VERSION_NAME: 1.${{ github.run_number }}
        run: npm run build

      - name: Sync Capacitor → Android
        working-directory: ./client
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build debug APK (signed with the repo's shared key)
        working-directory: ./client/android
        env:
          # Strictly increasing — Android refuses to install an APK whose
          # versionCode is not higher than the installed one.
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-tracker-pro-debug.apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (if pushed to main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          body: |
            Auto-built APK from commit ${{ github.sha }}.
            API URL: ${{ github.event.inputs.api_url || vars.VITE_API_URL || 'see workflow' }}

            Install on Android:
            1. Download the .apk file below
            2. On the phone: Settings → Security → enable "Install from unknown sources"
            3. Open the file, tap Install
          files: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK to the app server (powers in-app "Check for updates")
        if: github.event_name == 'push' && env.APP_PUBLISH_URL != ''
        env:
          APP_PUBLISH_URL: ${{ secrets.APP_PUBLISH_URL }}
          APP_PUBLISH_KEY: ${{ secrets.APP_PUBLISH_KEY }}
        run: |
          curl -sS --fail-with-body -X POST "$APP_PUBLISH_URL" \
            -H "X-API-Key: $APP_PUBLISH_KEY" \
            -F "file=@client/android/app/build/outputs/apk/debug/app-debug.apk" \
            -F "versionCode=${{ github.run_number }}" \
            -F "versionName=1.${{ github.run_number }}" \
            -F "notes=Build ${{ github.run_number }} from ${{ github.sha }}"
