apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────
// Signing credentials are read from android/keystore.properties, which is kept
// OUT of git (see .gitignore). Create it with your keystore path + passwords.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    // namespace = internal Java/R package (can differ from applicationId).
    namespace "com.sequencesurface.salestracker"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // applicationId = the PERMANENT Play Store identity. Must match the
        // package name your Play Console app is registered with.
        applicationId "sequence.salestracker.in"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version comes from CI (APP_VERSION_CODE = GitHub run number) so every
        // build is strictly newer than the last. Android REFUSES to install an
        // APK whose versionCode is not greater than the installed one, which is
        // half the reason updates previously needed an uninstall.
        // NOTE the parentheses. Groovy binds a paren-less method call tighter
        // than `?:`, so `versionName System.getenv(X) ?: "1.1"` parses as
        // `versionName(System.getenv(X)) ?: "1.1"` — passing null straight in
        // and failing with "Value is null" whenever the env var is unset.
        versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "2")
        versionName(System.getenv("APP_VERSION_NAME") ?: "1.1")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // THE fix for "uninstall before you can update".
        // Gradle auto-creates ~/.android/debug.keystore when none exists — and a
        // fresh CI runner has none, so EVERY GitHub Actions build was signed
        // with a brand-new key. Android treats a different signature as a
        // different app and blocks the install. Pointing debug builds at a
        // keystore committed to the repo keeps the signature identical across
        // builds, so new APKs install straight over the old one.
        debug {
            def sharedKs = rootProject.file('keystore/shared-debug.keystore')
            if (sharedKs.exists()) {
                storeFile sharedKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Use the release keystore when keystore.properties is present;
            // otherwise fall back to unsigned (debug) so the project still builds.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
